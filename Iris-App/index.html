<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src-tauri/icons/Iris_icon-1024px.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var themePreset = localStorage.getItem("iris.ui.themePreset") || "Black";
          var colorMode = localStorage.getItem("iris.ui.colorMode") || "dark";
          var themeColor = colorMode === "light" ? "#f5f6f8" : "#111316";
          var root = document.documentElement;
          root.style.setProperty("--boot-bg", themeColor);
          root.style.backgroundColor = themeColor;
          root.style.setProperty("color-scheme", colorMode === "light" ? "light" : "dark");
          if (document.body) {
            document.body.style.backgroundColor = themeColor;
          }
          root.setAttribute("data-iris-theme-preset", themePreset);
          root.setAttribute("data-iris-color-mode", colorMode);
          if (document.readyState !== "loading" && document.body) {
            document.body.style.backgroundColor = themeColor;
          } else {
            document.addEventListener("DOMContentLoaded", function () {
              document.body.style.backgroundColor = themeColor;
            }, { once: true });
          }
          var bootStyle = document.createElement("style");
          bootStyle.textContent = "@keyframes iris-boot-spin{to{transform:rotate(360deg)}}#iris-boot-splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--boot-bg,#111316);color:#9aa4b2;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;z-index:9999}#iris-boot-splash img{width:72px;height:72px;border-radius:16px;opacity:.92}#iris-boot-splash .sp{width:26px;height:26px;border:3px solid rgba(140,160,190,.25);border-top-color:#6ea8fe;border-radius:50%;animation:iris-boot-spin .8s linear infinite}#iris-boot-splash .lb{font-size:13px;letter-spacing:.3px}";
          document.head.appendChild(bootStyle);
          function mountBootSplash() {
            var rootEl = document.getElementById("root");
            if (!rootEl || document.getElementById("iris-boot-splash")) return;
            var s = document.createElement("div");
            s.id = "iris-boot-splash";
            s.innerHTML = '<img src="/src-tauri/icons/Iris_icon-1024px.png" alt="Iris" /><div class="sp"></div><div class="lb">Starting Iris\u2026</div>';
            rootEl.appendChild(s);
          }
          if (document.readyState !== "loading") {
            mountBootSplash();
          } else {
            document.addEventListener("DOMContentLoaded", mountBootSplash, { once: true });
          }
        } catch (err) {}
      })();
    </script>
    <title>Iris | Local Agent</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
