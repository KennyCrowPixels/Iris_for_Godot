name: Android APK (Iris Companion)

on:
  workflow_dispatch:
  push:
    paths:
      - iris-android-client/**
      - .github/workflows/android-apk.yml

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: iris-android-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install JS dependencies
        run: npm install --no-audit --no-fund
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build debug APK (installable, debug-signed)
        working-directory: iris-android-client/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Stage APK with a stable name
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "iris-companion-${GITHUB_SHA}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: iris-companion-apk
          path: iris-android-client/iris-companion-*.apk
          if-no-files-found: error
