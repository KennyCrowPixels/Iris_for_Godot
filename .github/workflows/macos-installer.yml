name: macOS Apple Silicon Installer

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/macos-installer.yml
      - Iris-App/**

permissions:
  contents: read

concurrency:
  group: macos-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: Iris-App
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Iris-App/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Check frontend
        run: |
          npm run check
          npm test
      - name: Test Rust runtime
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build Windows installers
        run: npm run tauri:build -- --bundles nsis,msi
      - uses: actions/upload-artifact@v4
        with:
          name: iris-windows-x64-${{ github.sha }}
          path: |
            Iris-App/src-tauri/target/release/bundle/nsis/*.exe
            Iris-App/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30
  macos-installer:
    runs-on: macos-14
    timeout-minutes: 60
    defaults:
      run:
        working-directory: Iris-App
    env:
      CARGO_BUILD_JOBS: 2
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Iris-App/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Install dependencies
        run: npm ci
      - name: Check frontend and model definitions
        run: |
          npm run check
          npm test
          npm run build
          node scripts/setup-models.mjs --profile balanced --check
          bash -n setup-macos.sh launch-macos.command
      - name: Test Rust runtime
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build Apple Silicon DMG
        run: npm run tauri:build -- --target aarch64-apple-darwin --bundles app,dmg
      - name: Verify architecture and record source revision
        run: |
          APP_ROOT="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/iris-app.app"
          file "$APP_ROOT/Contents/MacOS/iris-app"
          lipo "$APP_ROOT/Contents/MacOS/iris-app" -verify_arch arm64
          mkdir -p src-tauri/target/aarch64-apple-darwin/release/bundle/metadata
          printf '%s\n' "$GITHUB_SHA" > src-tauri/target/aarch64-apple-darwin/release/bundle/metadata/source-revision.txt
          shasum -a 256 src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg > src-tauri/target/aarch64-apple-darwin/release/bundle/metadata/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: iris-macos-aarch64-${{ github.sha }}
          path: |
            Iris-App/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            Iris-App/src-tauri/target/aarch64-apple-darwin/release/bundle/metadata/*
          if-no-files-found: error
          retention-days: 30